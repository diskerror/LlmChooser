; Option B: copy to /etc/php/8.4/fpm/pool.d/llmchooser.conf (match your PHP
; version), adjust user/group, then restart php8.4-fpm.
[llmchooser]
user = llama
group = llama
listen = /run/php/llmchooser.sock
listen.owner = www-data
listen.group = www-data
; One child per simultaneous request; a streaming chat holds one throughout.
pm = ondemand
pm.max_children = 8
pm.process_idle_timeout = 60s
