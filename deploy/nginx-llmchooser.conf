# Option B: copy to /etc/nginx/sites-available/llmchooser, adjust root/port,
# then link into sites-enabled. Uses the pool in php-fpm-llmchooser.conf.
server {
    listen 1234;
    server_name _;
    root /opt/llmchooser/public;
    client_max_body_size 20m;

    location / {
        try_files $uri /index.php$is_args$args;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_pass unix:/run/php/llmchooser.sock;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        # /v1/* streams model output: no buffering, no timeout on long answers.
        fastcgi_buffering off;
        fastcgi_read_timeout 3600s;
    }
}
